<!DOCTYPE html>
<html lang="en">
    <head>
        <title>block vs inline demonstration</title>
    </head>
    <body>
        <h2>blocked elements</h2>

        <div>csk</div>
        <div>rcb</div>
        <div>mumbai</div>

        <h2>inline elements</h2>

        <span>test</span>
        <span>odi</span>
        <span>t20</span>

        <h2>observation</h2>
        <p>div is a block elements</p>
        <p>each div starts on a new line</p>
        <p>span is an inline elements</p>
        <p>div takes more space,while span takes only the space needed for this content</p>
    </body>
