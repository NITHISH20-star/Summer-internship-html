<!DOCTYPE html>
<html>
<head>
   
    <title>Login Page</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box{
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            width: 300px;
        }

        h2{
            text-align: center;
        }

        input{
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button{
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background: #0056b3;
        }

        p{
            text-align: center;
        }

        a{
            text-decoration: none;
        }
    </style>
</head>
<body>
    


<div class="login-container">
    <form class="login-form">
        <h2>Welcome Back</h2>
        <p>Login to your Community Forum account</p>

        <input type="email" id="email" placeholder="Email Address" required>

        <input type="password" id="password" placeholder="Password" required>

        <div class="options">
            <label>
                <input type="checkbox"> Remember Me
            </label>

            <a href="#">Forgot Password?</a>
        </div>

        <button type="submit">Login</button>

        <p class="register">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </p>
    </form>
</div>
<script src="login.js"></script>

</body>
</html>
